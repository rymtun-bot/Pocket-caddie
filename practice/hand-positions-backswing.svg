<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 775" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="775" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">Pitch swings: half hinge and full hinge (right-handed)</text>
  <text x="480" y="56" text-anchor="middle" font-size="14" fill="#555">Your hands stay in front of your chest all the way back: the chest turns, so the camera sees them move right.</text>

  <!-- column headings -->
  <text x="170" y="92" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">1. Address</text>
  <text x="480" y="92" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">2. Half hinge: 54° carries 38</text>
  <text x="790" y="92" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">3. Full hinge: 54° carries 56</text>

  <!-- ============ ROW 1: FACE-ON ============ -->
  <text x="20" y="122" font-size="15" font-weight="bold" fill="#1a5fb4">FACE-ON (camera in front of you; target to the right): where the camera sees your hands</text>
  <g id="faceon" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round">
    <!-- panel 1 address, center 170 -->
    <line x1="40" y1="380" x2="300" y2="380" stroke="#aaa" stroke-width="2"/>
    <circle cx="170" cy="170" r="17"/>
    <line x1="170" y1="187" x2="170" y2="285"/>
    <line x1="170" y1="285" x2="132" y2="378"/>
    <line x1="170" y1="285" x2="208" y2="378"/>
    <line x1="170" y1="205" x2="180" y2="300"/>
    <line x1="170" y1="205" x2="186" y2="298"/>
    <line x1="183" y1="300" x2="170" y2="374" stroke="#777" stroke-width="3"/>
    <!-- panel 2 half hinge, center 480 -->
    <line x1="350" y1="380" x2="610" y2="380" stroke="#aaa" stroke-width="2"/>
    <circle cx="476" cy="170" r="17"/>
    <line x1="476" y1="187" x2="478" y2="285"/>
    <line x1="478" y1="285" x2="440" y2="378"/>
    <line x1="478" y1="285" x2="516" y2="378"/>
    <line x1="470" y1="205" x2="446" y2="290"/>
    <line x1="484" y1="205" x2="450" y2="290"/>
    <line x1="448" y1="292" x2="384" y2="228" stroke="#777" stroke-width="3"/>
    <!-- panel 3 full hinge, center 790 -->
    <line x1="660" y1="380" x2="920" y2="380" stroke="#aaa" stroke-width="2"/>
    <circle cx="790" cy="170" r="17"/>
    <line x1="790" y1="187" x2="794" y2="285"/>
    <line x1="794" y1="285" x2="756" y2="378"/>
    <line x1="794" y1="285" x2="832" y2="378"/>
    <line x1="800" y1="212" x2="748" y2="214"/>
    <line x1="778" y1="205" x2="750" y2="218"/>
    <line x1="749" y1="216" x2="752" y2="128" stroke="#777" stroke-width="3"/>
  </g>
  <!-- face-on hands + feet labels -->
  <circle cx="183" cy="300" r="7" fill="#d62828"/>
  <circle cx="449" cy="292" r="7" fill="#d62828"/>
  <circle cx="749" cy="216" r="7" fill="#d62828"/>
  <circle cx="170" cy="372" r="6" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="132" y="398" text-anchor="middle" font-size="12" fill="#555">right foot</text>
  <text x="208" y="398" text-anchor="middle" font-size="12" fill="#555">left foot</text>
  <text x="440" y="398" text-anchor="middle" font-size="12" fill="#555">right foot</text>
  <text x="756" y="398" text-anchor="middle" font-size="12" fill="#555">right foot</text>
  <line x1="756" y1="226" x2="756" y2="372" stroke="#d62828" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="170" y="420" text-anchor="middle" font-size="13" fill="#222">Hands at the inner left thigh,</text>
  <text x="170" y="437" text-anchor="middle" font-size="13" fill="#222">slightly ahead of the ball</text>
  <text x="480" y="420" text-anchor="middle" font-size="13" fill="#222">Hands in front of the chest (camera: at</text>
  <text x="480" y="437" text-anchor="middle" font-size="13" fill="#222">the right hip); shaft about 45° up</text>
  <text x="790" y="420" text-anchor="middle" font-size="13" fill="#222">Hands in front of the chest, left arm level</text>
  <text x="790" y="437" text-anchor="middle" font-size="13" fill="#222">(camera: above the right foot); shaft up</text>

  <!-- ============ ROW 2: DOWN THE LINE ============ -->
  <text x="20" y="478" font-size="15" font-weight="bold" fill="#1a5fb4">FROM BEHIND (camera behind you, looking at the target; the ball is to the right of you)</text>
  <g stroke="#333" stroke-width="4" fill="none" stroke-linecap="round">
    <!-- panel 1 -->
    <line x1="40" y1="720" x2="300" y2="720" stroke="#aaa" stroke-width="2"/>
    <circle cx="160" cy="532" r="17"/>
    <line x1="150" y1="548" x2="108" y2="628"/>
    <line x1="108" y1="628" x2="120" y2="676"/>
    <line x1="120" y1="676" x2="112" y2="718"/>
    <line x1="110" y1="718" x2="152" y2="718"/>
    <line x1="146" y1="560" x2="150" y2="640"/>
    <line x1="150" y1="640" x2="232" y2="716" stroke="#777" stroke-width="3"/>
    <!-- panel 2 -->
    <line x1="350" y1="720" x2="610" y2="720" stroke="#aaa" stroke-width="2"/>
    <circle cx="470" cy="532" r="17"/>
    <line x1="460" y1="548" x2="418" y2="628"/>
    <line x1="418" y1="628" x2="430" y2="676"/>
    <line x1="430" y1="676" x2="422" y2="718"/>
    <line x1="420" y1="718" x2="462" y2="718"/>
    <line x1="456" y1="560" x2="460" y2="628"/>
    <line x1="460" y1="628" x2="411" y2="576" stroke="#777" stroke-width="3"/>
    <!-- panel 3 -->
    <line x1="660" y1="720" x2="920" y2="720" stroke="#aaa" stroke-width="2"/>
    <circle cx="780" cy="532" r="17"/>
    <line x1="770" y1="548" x2="728" y2="628"/>
    <line x1="728" y1="628" x2="740" y2="676"/>
    <line x1="740" y1="676" x2="732" y2="718"/>
    <line x1="730" y1="718" x2="766" y2="718"/>
    <line x1="766" y1="560" x2="764" y2="592"/>
    <line x1="764" y1="592" x2="732" y2="528" stroke="#777" stroke-width="3"/>
  </g>
  <!-- toe line and ball line markers, DTL -->
  <g font-size="12" fill="#555" text-anchor="middle">
    <line x1="150" y1="560" x2="150" y2="720" stroke="#1a5fb4" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="150" y="740">toe line</text>
    <circle cx="232" cy="714" r="6" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="236" y="740">ball line</text>
    <line x1="460" y1="560" x2="460" y2="720" stroke="#1a5fb4" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="460" y="740">toe line</text>
    <circle cx="542" cy="714" r="6" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="546" y="740">ball line</text>
    <line x1="764" y1="560" x2="764" y2="720" stroke="#1a5fb4" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="764" y="740">toe line</text>
    <circle cx="852" cy="714" r="6" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="856" y="740">ball line</text>
    <!-- grip end pointing at the ball line -->
    <line x1="764" y1="592" x2="848" y2="712" stroke="#2a9d3f" stroke-width="2" stroke-dasharray="6,5"/>
    <line x1="460" y1="628" x2="538" y2="712" stroke="#2a9d3f" stroke-width="2" stroke-dasharray="6,5"/>
  </g>
  <circle cx="150" cy="640" r="7" fill="#d62828"/>
  <circle cx="460" cy="628" r="7" fill="#d62828"/>
  <circle cx="764" cy="592" r="7" fill="#d62828"/>
  <text x="182" y="600" font-size="12" fill="#222">about a fist from</text>
  <text x="182" y="615" font-size="12" fill="#222">the thighs</text>
  <text x="490" y="590" font-size="12" fill="#222">grip end points at</text>
  <text x="490" y="605" font-size="12" fill="#222">the ball line too</text>
  <text x="808" y="580" font-size="12" fill="#2a9d3f">grip end points</text>
  <text x="808" y="595" font-size="12" fill="#2a9d3f">at the ball line</text>

  <text x="480" y="760" text-anchor="middle" font-size="13" fill="#222">Through-swing: same length as the backswing. Rough checkpoints, not exact measurements.</text>
</svg>
