<circle cx="863.3" cy="519.4" r="7" fill="#d62828"/>
<text x="790" y="650" text-anchor="middle" font-size="13" fill="#222">Chest and hips facing the target side;</text>
<text x="790" y="666" text-anchor="middle" font-size="13" fill="#222">hands swing left, around you</text>
<text x="480" y="690" text-anchor="middle" font-size="13" fill="#555">Arrow = the way your chest faces. The hands never leave the space in front of the chest; the turn carries them around.</text>
</svg>