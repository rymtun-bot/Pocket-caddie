<text x="20" y="410" font-size="15" font-weight="bold" fill="#1a5fb4">DOWNSWING AND THROUGH: hips turn first, chest follows, hands stay in front of the chest</text>
<text x="170" y="440" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">4. Club level coming down</text>
