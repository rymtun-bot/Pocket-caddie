<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="Helvetica, Arial, sans-serif">
<rect width="960" height="700" fill="#fff"/>
<text x="480" y="30" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">Hand path from above: hands, chest and hips (right-handed)</text>
<text x="480" y="54" text-anchor="middle" font-size="14" fill="#555">Camera overhead looking down. Your back is at the top, the ball line at the bottom, the target to the right. Angles are rough.</text>
<g font-size="13"><line x1="250" y1="76" x2="280" y2="76" stroke="#1a5fb4" stroke-width="5"/><text x="286" y="81">shoulders / chest</text>
<line x1="420" y1="76" x2="450" y2="76" stroke="#e66100" stroke-width="5"/><text x="456" y="81">hips</text>
<circle cx="520" cy="76" r="6" fill="#d62828"/><text x="532" y="81">hands</text>
<line x1="590" y1="76" x2="620" y2="76" stroke="#999" stroke-width="2" stroke-dasharray="4,4"/><text x="626" y="81">hand path</text></g>
<text x="20" y="110" font-size="15" font-weight="bold" fill="#1a5fb4">BACKSWING: hands stay in front of the chest; the chest turns about twice as much as the hips</text>
