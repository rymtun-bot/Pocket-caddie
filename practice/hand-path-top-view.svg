<circle cx="494.0" cy="547.0" r="7" fill="#d62828"/>
<text x="480" y="650" text-anchor="middle" font-size="13" fill="#222">Hips open ~30°, chest about square,</text>
<text x="480" y="666" text-anchor="middle" font-size="13" fill="#222">hands just ahead of the ball</text>
<text x="790" y="440" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">6. Through (lead arm level)</text>
<line x1="660" y1="610" x2="920" y2="610" stroke="#999" stroke-dasharray="6,5"/>
<text x="662" y="627" font-size="11" fill="#777">ball line</text>
<text x="918" y="627" font-size="11" fill="#777" text-anchor="end">target →</text>
<circle cx="790" cy="610" r="5" fill="#fff" stroke="#333" stroke-width="2"/>
<ellipse cx="745" cy="560" rx="9" ry="16" fill="#ddd" stroke="#888"/>
<ellipse cx="835" cy="560" rx="9" ry="16" fill="#ddd" stroke="#888"/>
