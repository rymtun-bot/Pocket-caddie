<text x="352" y="627" font-size="11" fill="#777">ball line</text>
<text x="608" y="627" font-size="11" fill="#777" text-anchor="end">target →</text>
<circle cx="480" cy="610" r="5" fill="#fff" stroke="#333" stroke-width="2"/>
<ellipse cx="435" cy="560" rx="9" ry="16" fill="#ddd" stroke="#888"/>
<ellipse cx="525" cy="560" rx="9" ry="16" fill="#ddd" stroke="#888"/>
<polyline points="420.2,526.6 494.0,547.0 553.3,519.4" fill="none" stroke="#bbb" stroke-width="2" stroke-dasharray="4,4"/>
<line x1="454.0" y1="520.0" x2="506.0" y2="490.0" stroke="#e66100" stroke-width="7" stroke-linecap="round"/>
<line x1="434.0" y1="505.0" x2="526.0" y2="505.0" stroke="#1a5fb4" stroke-width="7" stroke-linecap="round"/>
<line x1="480" y1="505" x2="480.0" y2="527.0" stroke="#1a5fb4" stroke-width="2"/>
<circle cx="480.0" cy="529.0" r="3" fill="#1a5fb4"/>
