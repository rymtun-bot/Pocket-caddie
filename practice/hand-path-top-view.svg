<text x="480" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">2. Club level (half hinge)</text>
<line x1="350" y1="310" x2="610" y2="310" stroke="#999" stroke-dasharray="6,5"/>
<text x="352" y="327" font-size="11" fill="#777">ball line</text>
<text x="608" y="327" font-size="11" fill="#777" text-anchor="end">target →</text>
